# Rate limiting zones for wedding.nhotin.space (uses Cloudflare real client IP when available)
map $http_cf_connecting_ip $wedding_client_ip {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $wedding_client_ip zone=wedding_general_zone:10m rate=30r/s;
limit_req_zone $wedding_client_ip zone=wedding_submit_zone:10m rate=10r/m;
limit_req_zone $wedding_client_ip zone=wedding_login_zone:10m rate=5r/m;
