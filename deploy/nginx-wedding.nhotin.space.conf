server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wedding.nhotin.space;

    server_tokens off;
    client_max_body_size 64k;

    access_log /var/log/nginx/wedding.nhotin.space.access.log;
    error_log /var/log/nginx/wedding.nhotin.space.error.log warn;

    ssl_certificate /etc/nginx/ssl/nhotin.space.crt;
    ssl_certificate_key /etc/nginx/ssl/nhotin.space.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Enforce HTTPS even when traffic enters via Cloudflare Tunnel on plain HTTP
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Defense-in-depth: block hidden files, backend code, raw JSON storage, and deployment scripts
    location ~ /\. {
        return 404;
    }

    location ~* ^/(backend|deploy|scripts|node_modules)/ {
        return 404;
    }

    location ~* ^/data/(submissions|source-page\.html|wedding-info\.(json|md)) {
        return 404;
    }

    location ~* ^/(server\.js|vite\.config\.js|package(-lock)?\.json|README\.md)$ {
        return 404;
    }

    # Strict rate-limiting on admin login endpoint
    location = /api/admin/login {
        limit_req zone=wedding_login_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_hide_header X-Powered-By;
    }

    # Anti-spam rate-limiting on guestbook & RSVP endpoints
    location ~ ^/api/(wishes|rsvps)$ {
        limit_req zone=wedding_submit_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_hide_header X-Powered-By;
    }

    # Admin page and protected APIs (never cache)
    location ~ ^/(admin|api/) {
        limit_req zone=wedding_general_zone burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_hide_header X-Powered-By;
    }

    # Static assets & main invitation
    location / {
        limit_req zone=wedding_general_zone burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_hide_header X-Powered-By;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name wedding.nhotin.space;

    if ($host = wedding.nhotin.space) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
